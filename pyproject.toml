[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-bot-2"
version = "0.1.0"
description = "Causal, research-only quantitative trading experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
quant-bot = "quant_bot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

